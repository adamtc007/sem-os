[workspace]
members = [
    "crates/sem_os_types",
    "crates/sem_os_core",
    "crates/sem_os_ontology",
    "crates/sem_os_policy",
]
resolver = "2"

[workspace.dependencies]
# Intra-workspace crates
sem_os_types    = { path = "crates/sem_os_types" }
sem_os_core     = { path = "crates/sem_os_core"  }
sem_os_ontology = { path = "crates/sem_os_ontology" }
sem_os_policy   = { path = "crates/sem_os_policy"   }
# Cross-repo dsl library — local [patch] in .cargo/config.toml overrides during dev
dsl_types = { git = "https://github.com/adamtc007/dsl", tag = "v0.1.0" }
dsl-core  = { git = "https://github.com/adamtc007/dsl", tag = "v0.1.0" }

[workspace.lints.rust]
unreachable_pub = "deny"
